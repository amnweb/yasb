[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "YASB"
dynamic = ["version"]
description = "Yet Another Status Bar - A highly configurable Windows status bar written in Python."
authors = [
    { name = "AmN" },
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "pyqt6==6.12.0",
    "pydantic==2.14.1",
    "certifi==2026.10.19",
    "humanize==4.16.0",
    "pyyaml==6.0.3",
    "watchdog==6.0.0",
    "pycaw==20260927",
    "pillow==13.0.0",
    "qasync==0.28.0",
    "comtypes==1.4.17",
    "python-dotenv==1.2.4",
    "tzdata==2026.5",
    "winrt.windows.foundation==4!10.0.28000.2705",
    "winrt.windows.foundation.collections==4!10.0.28000.2705",
    "winrt.windows.data.xml.dom==4!10.0.28000.2705",
    "winrt.windows.media==4!10.0.28000.2705",
    "winrt.windows.media.control==4!10.0.28000.2705",
    "winrt.windows.management.deployment==4!10.0.28000.2705",
    "winrt.windows.applicationmodel==4!10.0.28000.2705",
    "winrt.windows.applicationmodel.core==4!10.0.28000.2705",
    "winrt.windows.applicationmodel.datatransfer==4!10.0.28000.2705",
    "winrt.windows.networking==4!10.0.28000.2705",
    "winrt.windows.networking.connectivity==4!10.0.28000.2705",
    "winrt.windows.storage==4!10.0.28000.2705",
    "winrt.windows.storage.streams==4!10.0.28000.2705",
    "winrt.windows.ui==4!10.0.28000.2705",
    "winrt.windows.ui.notifications==4!10.0.28000.2705",
    "winrt.windows.ui.notifications.management==4!10.0.28000.2705",
    "winrt.windows.devices.bluetooth==4!10.0.28000.2705",
    "winrt.windows.devices.display==4!10.0.28000.2705",
    "winrt.windows.devices.enumeration==4!10.0.28000.2705",
    "winrt.windows.devices.radios==4!10.0.28000.2705",
    "winrt.windows.devices.wifi==4!10.0.28000.2705",
    "winrt.windows.security.credentials==4!10.0.28000.2705",
    "winrt.windows.ui.viewmanagement==4!10.0.28000.2705",
    "winrt.windows.ui.composition==4!10.0.28000.2705.1",
    "winrt.windows.ui.composition.interop==4.0.0",
    "winrt.windows.foundation.numerics==4!10.0.28000.2705",
    "winrt.windows.system==4!10.0.28000.2705",
    "winrt.windows.system.interop==4.0.0",
    "winrt.windows.ui.composition.desktop==4!10.0.28000.2705.1",
]

[project.urls]
Homepage = "https://github.com/amnweb/yasb"
Documentation = "https://github.com/amnweb/yasb/wiki"
Repository = "https://github.com/amnweb/yasb"
Issues = "https://github.com/amnweb/yasb/issues"
Changelog = "https://github.com/amnweb/yasb/releases/latest"

[project.optional-dependencies]
dev = [
    "YASB[test,packaging]",
    "pre-commit",
    "ruff==0.17.1",
    "pyright==1.1.414",
    "pycaw-stubs==20260927.20261008",
    "types-pillow==10.2.0.20240822",
]
test = [
    "pytest==9.1.1",
]
packaging = [
    "cx-freeze==8.6.4"
]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/settings.py"
pattern = "BUILD_VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra"]
strict = true
faulthandler_timeout = "300"
markers = [
    "sdk: compares ctypes code with the Windows SDK; needs MSVC, skipped without it unless YASB_REQUIRE_SDK=1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "__pycache__",
    ".github",
    ".vscode",
    "build",
    "docs",
    "demo"
]

[tool.ruff.lint]
ignore = [
    "F405",
    "F403",
    "E741",
]
select = ["I", "F", "UP", "G004"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format     = true
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "cr-lf"

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", "src/build", "src/dist"]
extraPaths = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
reportMissingImports = true
reportUntypedFunctionDecorator = false
